[package]
name = "sundb-network"
version = "0.1.0"
edition = "2021"
description = "Network and client-server transport layer for SUNDB"
license = "MIT"

[dependencies]
sundb-core = { path = "../sundb-core" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "=1.41.1", features = ["full"] }
thiserror = "1.0"
